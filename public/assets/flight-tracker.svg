<svg width="1200" height="675" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="headerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0F172A;stop-opacity:0.9" />
      <stop offset="100%" style="stop-color:#1E293B;stop-opacity:0.9" />
    </linearGradient>
  </defs>
  
  <!-- Main background -->
  <rect width="1200" height="675" fill="url(#bgGradient)"/>
  
  <!-- Header -->
  <rect width="1200" height="70" fill="url(#headerGradient)"/>
  <text x="30" y="45" font-size="28" font-weight="bold" fill="#3B82F6" font-family="Arial, sans-serif">
    ✈️ Flight Tracker
  </text>
  
  <!-- Left sidebar - Search panel -->
  <rect x="20" y="90" width="280" height="560" fill="#1E293B" rx="12" opacity="0.8"/>
  
  <!-- Search title -->
  <text x="40" y="130" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif">
    Search Flight
  </text>
  
  <!-- Search box -->
  <rect x="35" y="150" width="250" height="40" fill="#0F172A" rx="8" stroke="#3B82F6" stroke-width="2"/>
  <text x="50" y="177" font-size="14" fill="#94A3B8" font-family="Arial, sans-serif">
    Flight Number
  </text>
  
  <!-- Flight list -->
  <text x="40" y="230" font-size="14" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif">
    Recent Flights
  </text>
  
  <!-- Flight item 1 -->
  <rect x="35" y="250" width="250" height="50" fill="#334155" rx="8"/>
  <text x="50" y="270" font-size="13" font-weight="bold" fill="#3B82F6" font-family="Arial, sans-serif">BA456</text>
  <text x="50" y="290" font-size="11" fill="#CBD5E1" font-family="Arial, sans-serif">London → New York</text>
  
  <!-- Flight item 2 -->
  <rect x="35" y="310" width="250" height="50" fill="#0F172A" rx="8" stroke="#3B82F6" stroke-width="1"/>
  <text x="50" y="330" font-size="13" font-weight="bold" fill="#3B82F6" font-family="Arial, sans-serif">AF789</text>
  <text x="50" y="350" font-size="11" fill="#CBD5E1" font-family="Arial, sans-serif">Paris → Los Angeles</text>
  
  <!-- Flight item 3 -->
  <rect x="35" y="370" width="250" height="50" fill="#334155" rx="8"/>
  <text x="50" y="390" font-size="13" font-weight="bold" fill="#3B82F6" font-family="Arial, sans-serif">DL234</text>
  <text x="50" y="410" font-size="11" fill="#CBD5E1" font-family="Arial, sans-serif">Atlanta → Miami</text>
  
  <!-- Map area - Center -->
  <rect x="320" y="90" width="580" height="560" fill="#334155" rx="12" opacity="0.6"/>
  
  <!-- Map title -->
  <text x="340" y="130" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif">
    Live Flight Map
  </text>
  
  <!-- Simple map representation -->
  <circle cx="600" cy="300" r="150" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.3"/>
  <circle cx="600" cy="300" r="100" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.2"/>
  <circle cx="600" cy="300" r="50" fill="none" stroke="#3B82F6" stroke-width="1" opacity="0.1"/>
  
  <!-- Aircraft marker -->
  <circle cx="550" cy="280" r="8" fill="#10B981"/>
  <text x="540" y="320" font-size="24" fill="#3B82F6" font-family="Arial, sans-serif">✈️</text>
  
  <!-- Destination marker -->
  <circle cx="680" cy="340" r="8" fill="#EF4444"/>
  
  <!-- Route line -->
  <line x1="550" y1="280" x2="680" y2="340" stroke="#3B82F6" stroke-width="2" opacity="0.6"/>
  
  <!-- Right panel - Flight details -->
  <rect x="920" y="90" width="260" height="560" fill="#1E293B" rx="12" opacity="0.8"/>
  
  <!-- Details title -->
  <text x="940" y="130" font-size="16" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif">
    Flight Details
  </text>
  
  <!-- Flight number display -->
  <text x="940" y="170" font-size="12" fill="#94A3B8" font-family="Arial, sans-serif">Flight Number</text>
  <text x="940" y="190" font-size="18" font-weight="bold" fill="#3B82F6" font-family="Arial, sans-serif">BA456</text>
  
  <!-- Status -->
  <text x="940" y="230" font-size="12" fill="#94A3B8" font-family="Arial, sans-serif">Status</text>
  <rect x="940" y="240" width="80" height="24" fill="#3B82F6" rx="4"/>
  <text x="950" y="257" font-size="11" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif">In Air</text>
  
  <!-- Progress bar -->
  <text x="940" y="310" font-size="12" fill="#94A3B8" font-family="Arial, sans-serif">Progress</text>
  <rect x="940" y="320" width="220" height="8" fill="#0F172A" rx="4"/>
  <rect x="940" y="320" width="88" height="8" fill="#3B82F6" rx="4"/>
  <text x="1075" y="340" font-size="10" fill="#94A3B8" font-family="Arial, sans-serif">40%</text>
  
  <!-- Departure/Arrival info -->
  <text x="940" y="380" font-size="11" fill="#CBD5E1" font-family="Arial, sans-serif">
    <tspan x="940" dy="0">From: London (LHR)</tspan>
    <tspan x="940" dy="20">To: New York (JFK)</tspan>
    <tspan x="940" dy="20">Duration: 7h 20m</tspan>
  </text>
  
  <!-- Admin button hint -->
  <rect x="940" y="480" width="220" height="36" fill="#3B82F6" rx="8" opacity="0.9"/>
  <text x="1000" y="505" font-size="13" font-weight="bold" fill="#FFFFFF" font-family="Arial, sans-serif" text-anchor="middle">
    Admin Panel
  </text>
  
  <!-- Footer text -->
  <text x="600" y="670" font-size="12" fill="#64748B" font-family="Arial, sans-serif" text-anchor="middle">
    Real-time flight tracking with Leaflet maps • React • Professional UI
  </text>
</svg>
